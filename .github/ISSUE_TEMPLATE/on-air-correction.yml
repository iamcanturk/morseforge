name: On-air correction
description: Something about prosigns, Q-codes, callsigns or a typical exchange is wrong or misleading.
title: "On-air: "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. The maintainer is not a licensed operator, so corrections from people who are on the air are the most useful issues this project gets.
  - type: input
    id: page
    attributes:
      label: Where
      description: The page URL or the drill where you saw it.
      placeholder: https://morse.iamcanturk.dev/copy/
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What it says now
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What it should say, and why
      description: A source helps (a band plan, an ARRL/IARU page, common practice on your band).
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit
      description: Optional. Your callsign or name, if you would like to be thanked in the release notes.

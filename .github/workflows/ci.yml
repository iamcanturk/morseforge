# No step interpolates untrusted event data into a shell. The only `${{ }}` here
# is `github.ref`, used in the concurrency group, which is never passed to `run`.
name: CI

# Manual only, for now.
#
# The account is locked for billing, so GitHub refuses to start the job at all:
# every push produced a run that failed in three seconds with "the job was not
# started because your account is locked due to a billing issue". A red cross
# on every commit reads as a broken project to anyone browsing the repo, and it
# is not — the same checks run on every push through .githooks/pre-push, which
# is the primary gate here precisely because Actions cannot be relied on.
#
# To turn it back on when billing is sorted, restore:
#
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Assertions about the build output live in scripts/check-build.sh so
      # that CI and the local pre-push hook run exactly the same checks. Keeping
      # them in this file meant they could not be run locally at all, and would
      # drift the moment either side changed.
      - name: Build checks
        run: npm run check:build

      # GitHub Actions is not always available on this account, so the pre-push
      # hook is the primary gate and this workflow is the backstop. If the hook
      # were bypassed, this is what catches it.

# nginx vhost template for morse.iamcanturk.dev
#
# Paste this into CloudPanel: Sites → morse.iamcanturk.dev → Vhost → Save.
# The `{{...}}` placeholders are CloudPanel's own and must be left alone —
# it substitutes the certificate paths, document root and log paths when it
# regenerates /etc/nginx/sites-enabled/morse.iamcanturk.dev.conf.
#
# This exists because CloudPanel's default static template is wrong for a PWA
# in three ways, each of which is invisible until it bites:
#
#   1. `sw.js` matches the generic `.js` rule and gets `expires max`, so the
#      service worker is cached for ten years. Every returning visitor stays
#      pinned to whichever build they first loaded, forever. This is the one
#      that actually breaks the product.
#   2. `manifest.webmanifest` has no entry in nginx's type map and is served as
#      application/octet-stream. Some browsers refuse to install a PWA whose
#      manifest arrives with the wrong content type.
#   3. There is no `error_page`, so a bad URL gets nginx's built-in 404 rather
#      than the site's own.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name morse.iamcanturk.dev;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # --------------------------------------------------------------------------
  # Security headers
  #
  # None of these were set. They are cheap for a static site and each closes a
  # real class of problem, so there was no reason not to.
  #
  # THE TRAP: nginx inherits `add_header` from the server block into a location
  # only if that location declares no `add_header` of its own — and then it
  # drops *all* of them, not just the ones that clash. Every location here sets
  # a Cache-Control, so a first attempt at this produced headers that appeared
  # on 404s and on nothing else. `always` does not help; it governs error
  # responses, not inheritance.
  #
  # So they are repeated below in every location that serves a document. The
  # full set only goes where it can do something: a Content-Security-Policy on
  # a stylesheet response accomplishes nothing, while `nosniff` on one does.
  # --------------------------------------------------------------------------

  # Two years, with subdomains and preload-eligible. Safe here: this host has
  # never served anything over plain HTTP except the redirect above.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Stop a browser guessing a type we did not declare — the reason .md had to
  # be given text/markdown explicitly rather than left to sniffing.
  add_header X-Content-Type-Options "nosniff" always;

  # Send the origin, not the full path, to other sites. A privacy improvement
  # as much as a security one: nobody needs to know which article someone was
  # reading when they followed a link out.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # This site asks for none of these, so nothing embedded in it should be able
  # to either.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

  # Content Security Policy.
  #
  # `unsafe-inline` for scripts is not something to be pleased about, and it is
  # here for a reason rather than out of laziness: the theme is applied by an
  # inline script that must run before first paint, Astro inlines its island
  # hydration, Cloudflare injects the analytics beacon, and the Google Analytics
  # consent loader is inline so pages without islands stay free of bundles.
  # Hashes would need regenerating on every build and would break silently
  # when one was missed.
  #
  # Google Analytics 4 (TASK-039): gtag.js comes from www.googletagmanager.com
  # and is injected only after the visitor accepts; its hits go to
  # region1.google-analytics.com, *.analytics.google.com and, for some
  # configurations, *.googletagmanager.com, by fetch/sendBeacon (connect-src)
  # or as a pixel fallback (img-src). Without these hosts the browser blocks
  # gtag silently and GA shows nothing. Every location that sets a CSP below
  # carries the same string; change them together.
  #
  # It is still worth having. Even permitting inline scripts, this blocks
  # loading executable code from any other origin, blocks plugins outright,
  # stops the page being framed, and prevents a base-tag injection from
  # redirecting every relative URL on the page.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # The service worker decides which build every returning visitor sees, so it
  # must always be revalidated. Without this block it matches the generic .js
  # rule below and is cached until 2037.
  location = /sw.js {
    # Not the full set: a CSP on an asset response does nothing, while these two
    # do. See the note at the top of the server block for why they are here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache, must-revalidate";
    # Cloudflare's Browser Cache TTL setting rewrites the Cache-Control we send
    # to browsers, and its edge cache stores the file regardless. These two
    # headers are the origin-side half of the fix: CDN-Cache-Control is the
    # standard directive for "this is for the CDN, not the browser", and
    # Cloudflare honours it ahead of Cache-Control at the edge. The other half
    # is a dashboard setting — see deploy/README.md.
    add_header CDN-Cache-Control "no-store";
    add_header Cloudflare-CDN-Cache-Control "no-store";
    expires off;
    access_log off;
  }

  location = /manifest.webmanifest {
    # Not the full set: a CSP on an asset response does nothing, while these two
    # do. See the note at the top of the server block for why they are here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
  }

  # Anonymous usage counters. nginx answers and stores nothing; the request
  # line in the access log *is* the record, which is why there is no PHP, no
  # database and no third party behind the numbers on /panel/.
  #
  # No `access_log off` here, deliberately: the log line is the entire point,
  # and turning it off would leave a block that still answered 204 while
  # silently recording nothing.
  location /e/ {
    add_header Cache-Control "no-store";
    add_header CDN-Cache-Control "no-store";
    return 204;
  }

  # The author's own tools. The password is the protection; robots.txt and the
  # noindex only keep them out of search results.
  #
  # `^~` rather than a plain prefix so the match is settled before any regex
  # location is considered. The panel reads /panel/data.json, and a prefix
  # match would lose to any regex block that later grew a `json` extension —
  # serving the summary with no password and no way to notice.
  #
  # The password file must be mode 644, not 640: nginx runs as `clp`, which is
  # not in this site's group. It can traverse the home directory — that is how
  # the document root is served at all — but it cannot read a group-only file.
  # 644 inside a 0770 home is still unreadable to any other site on the box.
  location ^~ /panel/ {
    # Repeated because this location sets its own Cache-Control; see the note
    # at the top of the server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    auth_basic "MorseForge";
    auth_basic_user_file /home/iamcanturk-morse/.htpasswd;
    add_header Cache-Control "no-store";
    add_header CDN-Cache-Control "no-store";
    try_files $uri $uri/ =404;
  }

  location ^~ /studio/ {
    # Repeated because this location sets its own Cache-Control; see the note
    # at the top of the server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    auth_basic "MorseForge";
    auth_basic_user_file /home/iamcanturk-morse/.htpasswd;
    add_header Cache-Control "no-store";
    add_header CDN-Cache-Control "no-store";
    try_files $uri $uri/ =404;
  }

  # Belt and braces: a password file that ever ends up under the document root
  # must not be downloadable.
  location ~ /\.ht {
    deny all;
    return 404;
  }

  # Markdown copies of the articles, for assistants.
  #
  # nginx has no MIME type for .md, so without this it serves them as
  # application/octet-stream — which makes a browser download the file instead
  # of showing it, and gives a crawler no reason to treat it as text. The
  # `rel="alternate"` link on every post points here, so the type has to be
  # right or the whole arrangement is decorative.
  location ~* \.md$ {
    # Not the full set: a CSP on an asset response does nothing, while these two
    # do. See the note at the top of the server block for why they are here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "public, max-age=300";
    add_header CDN-Cache-Control "public, max-age=300";
    expires off;
  }

  # Generated for crawlers. A stale sitemap or robots.txt served from cache is
  # worse than a slightly slower fresh one.
  location ~* ^/(robots\.txt|llms\.txt|sitemap.*\.xml)$ {
    # Not the full set: a CSP on an asset response does nothing, while these two
    # do. See the note at the top of the server block for why they are here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300";
    add_header CDN-Cache-Control "public, max-age=300";
    expires off;
  }

  # Astro fingerprints these filenames, so the content behind a given name can
  # never change. Safe to cache immutably for a year.
  location ^~ /_astro/ {
    # Not the full set: a CSP on an asset response does nothing, while these two
    # do. See the note at the top of the server block for why they are here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location ~* ^.+\.(css|js|mjs|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf)$ {
    # Not the full set: a CSP on an asset response does nothing, while these two
    # do. See the note at the top of the server block for why they are here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  # HTML is the entry point to every fingerprinted asset. Caching it is exactly
  # what makes a deploy invisible to someone who has already visited.
  location ~* \.html$ {
    # Repeated because this location sets its own Cache-Control; see the note
    # at the top of the server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-cache, must-revalidate";
    expires off;
  }

  location / {
    # Repeated because this location sets its own Cache-Control; see the note
    # at the top of the server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-cache, must-revalidate";
    expires off;
    try_files $uri $uri/ =404;
  }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MorseForge">
  <title>MorseForge</title>
  <!-- The letter M in Morse is dash-dash. The bars are deliberately unequal and
       left-aligned: equal bars read as an "=" sign at favicon size. -->
  <rect x="6" y="16" width="52" height="12" rx="6" fill="#00E88F"/>
  <rect x="6" y="36" width="38" height="12" rx="6" fill="#00A868"/>
</svg>
